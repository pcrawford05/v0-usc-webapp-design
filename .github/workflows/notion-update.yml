name: Daily Notion Update

# Run on schedule or manual dispatch
on:
  schedule:
    - cron: "0 4 * * *"  # Every day at 4:00 AM UTC
  workflow_dispatch:    # Allows manual trigger from GitHub UI

jobs:
  update-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install

      - name: Run Notion sync script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "Running Notion sync..."
          echo "Node version: $(node -v)"
          echo "PNPM version: $(pnpm -v)"
          echo "NOTION_API_KEY length: ${#NOTION_API_KEY}"
          echo "NOTION_DATABASE_ID length: ${#NOTION_DATABASE_ID}"
          pnpm run content:sync || true
