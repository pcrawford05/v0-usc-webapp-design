name: Daily Notion Update

on:
  schedule:
    - cron: "0 11 * * *"  # Every day at 11:00 AM UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI

permissions:
  contents: write  # To push changes to the repository
jobs:
  update-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install

      - name: Run Notion sync script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_SUMMARY_MODEL: ${{ secrets.HF_SUMMARY_MODEL }}
        run: pnpm exec tsx scripts/sync-content.ts

      - name: Commit and push updated data if changes exist
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # Only commit if there are changes
          git add data/notion-data.json data/embeddings.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily update: Notion data & embeddings"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ai-test
          else
            echo "No changes detected, skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
